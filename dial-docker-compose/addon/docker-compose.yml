include:
  - path: ../common.yml
    env_file: ./.env

services:
  # Pinned below the common.yml default: DIAL Core dropped the legacy top-level
  # "assistant" config block (used by the todo-assistant deployment below) in 0.38.0.
  core:
    image: epam/ai-dial-core:0.37.0

  adapter-openai:
    image: epam/ai-dial-adapter-openai:0.43.2
    environment:
      WEB_CONCURRENCY: "3"

  assistant:
    image: epam/ai-dial-assistant:0.7.0
    environment:
      OPENAI_API_BASE: "http://core:8080"
      WEB_CONCURRENCY: "3"

  addon:
    build: addon